<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{font-family:-apple-system,sans-serif;margin:24px;background:#f6f7f9;color:#111}
.shell{max-width:760px;background:#fff;border:1px solid #d8dbe0;border-radius:8px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.composer{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-height:56px;border:1px solid #d8dbe0;border-radius:4px;padding:8px;font:inherit;resize:none}
.btn{padding:6px 12px;border-radius:4px;font-size:12px;background:#1f6bff;color:#fff;border:0;cursor:pointer}
.mentions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:#eef2ff;border:1px solid #c9d4ff;color:#1a3fb5;border-radius:12px;padding:2px 10px;font-size:12px}
.attach{border:1px dashed #c9cdd3;border-radius:4px;padding:10px;color:#666;font-size:12px;display:flex;gap:8px;align-items:center;margin-top:8px}
.browser{display:flex;gap:8px;margin-top:12px;border:1px solid #d8dbe0;border-radius:6px;padding:8px;align-items:center}
.addr{flex:1;border:1px solid #d8dbe0;border-radius:4px;padding:6px 8px;font-size:12px}
.tab{display:inline-flex;gap:6px;margin-left:8px}
</style></head><body><div class="shell">
<div class="mentions"><span class="chip">@src/agent.ts</span><span class="chip">@src/tools.ts</span><span class="chip">#symbol refactor</span></div>
<div class="composer"><textarea placeholder="Refactor the agent loop..."></textarea><button class="btn">Send</button></div>
<div class="attach"><span>🖼 image attached (screenshot.png)</span></div>
<div class="browser"><span>🌐</span><input class="addr" value="https://example.com"><button class="btn">Navigate</button><span class="tab">BrowserOS neo</span></div>
</div></body></html>
