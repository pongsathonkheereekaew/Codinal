<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{font-family:-apple-system,sans-serif;margin:24px;background:#f6f7f9;color:#111}
.shell{max-width:700px;background:#fff;border:1px solid #d8dbe0;border-radius:8px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:20px;white-space:pre;background:#fafbfc;border:1px solid #eee;border-radius:4px;padding:12px}
.ghost{color:#8c8c8c;position:relative}
.tab{display:inline-flex;gap:6px;margin-top:10px}
.kbd{border:1px solid #c9cdd3;border-radius:4px;padding:2px 8px;font-size:12px;background:#fff}
.badge{display:inline-block;background:#e6ffec;color:#1a7f37;border-radius:3px;padding:2px 8px;font-size:11px;margin-bottom:8px}
</style></head><body><div class="shell">
<span class="badge">Tab accepts · Esc rejects</span>
<div class="code"><span>const</span> <span>greeting</span> <span>=</span> <span>'hello'</span><span class="ghost">_CEDIA_SUGGESTION</span></div>
<div class="tab"><span class="kbd">Tab</span> accept <span class="kbd">Esc</span> reject <span class="kbd">Alt+Tab</span> next</div>
</div></body></html>
