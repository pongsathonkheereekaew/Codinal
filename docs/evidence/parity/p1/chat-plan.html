<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{font-family:-apple-system,sans-serif;margin:24px;background:#f6f7f9;color:#111}
.shell{max-width:420px;background:#fff;border:1px solid #d8dbe0;border-radius:8px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.topbar{display:flex;justify-content:space-between;font-size:13px;color:#555;margin-bottom:12px}
.msg{padding:8px 10px;border-radius:4px;font-size:13px;margin-bottom:8px;line-height:1.4}
.user{background:#eef1f5;text-align:right}
.assistant{background:#fff;border:1px solid #d8dbe0}
.tool{font-size:12px;color:#7a7a7a;display:flex;gap:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:#3f8cff}
.plan{border:1px solid #d8dbe0;border-radius:6px;padding:10px;margin:12px 0}
.step{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.badge{padding:1px 6px;border-radius:3px;font-size:11px}
.badge.pending{background:#fff3d4;color:#8a6d00}
.btn{padding:6px 10px;border:1px solid #c9cdd3;border-radius:4px;font-size:12px;background:#fff;cursor:pointer}
.btn.primary{background:#1f6feb;color:#fff;border-color:#1f6feb}
.composer{display:flex;gap:8px;margin-top:12px}
.composer textarea{flex:1;min-height:56px;border:1px solid #d8dbe0;border-radius:4px;padding:8px;font:inherit;resize:none}
</style></head><body>
<div class="shell">
  <div class="topbar"><span>cedia-agent</span><span class="badge pending">running</span></div>
  <div class="msg user">Refactor the agent tool loop</div>
  <div class="msg assistant"><strong>Plan</strong><br>1. Read tools.ts<br>2. Extract approval boundary<br>3. Add tests</div>
  <div class="plan">
    <div class="step"><span class="badge pending">approved</span> Read tools.ts <button class="btn">Approve</button><button class="btn">Reject</button></div>
    <div class="step"><span class="badge pending">pending</span> Extract approval boundary <button class="btn">Approve</button><button class="btn">Reject</button></div>
    <div class="step"><span class="badge pending">pending</span> Add tests <button class="btn">Approve</button><button class="btn">Reject</button></div>
  </div>
  <div class="tool"><span class="dot"></span><span>git_diff</span></div>
  <div class="composer"><textarea placeholder="Ask CEDIA to plan, write, or refactor"></textarea><button class="btn primary">Send</button></div>
</div>
</body></html>
