# Cursor adapter metadata for ~/.agents/standards/*.md
# Regenerate: ~/.agents/scripts/gen-cursor-rules.sh
# Template package: includes writing.md plus guardrails/persona mirrors of the live harness.

writing:
  body: writing.md
  out: writing-standards.mdc
  description: Shared writing and copy standards
  alwaysApply: true

agent-guardrails:
  body: agent-guardrails.md
  out: agent-guardrails.mdc
  description: Risk classes, inbox/standing/scheduler contracts, destructive actions, secrets, verify gates, spines
  alwaysApply: false

persona-manifest:
  body: persona-manifest.md
  out: persona-manifest.mdc
  description: Optional persona frontmatter schema (persona extends skill shape); not always-on
  alwaysApply: false
