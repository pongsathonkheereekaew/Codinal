[package]
name = "codinal-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
codinal-harness = { path = "../codinal-harness" }
codinal-tools = { path = "../codinal-tools" }
codinal-storage = { path = "../codinal-storage" }
codinal-policy = { path = "../codinal-policy" }
codinal-providers = { path = "../codinal-providers" }
fs2 = "=0.4.3"
libc = "=0.2.189"
