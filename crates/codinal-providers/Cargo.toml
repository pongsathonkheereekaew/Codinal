[package]
name = "codinal-providers"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt", "time"] }
zeroize = { version = "=1.9.0", features = ["alloc", "derive"] }
