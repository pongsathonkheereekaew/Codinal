<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentMonitor — TownHall</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🏢 AgentMonitor <span class="sub">TownHall v0 — pixel office (dashboard)</span></h1>
  <div id="health-leds" class="leds"></div>
  <button id="btn-restart" class="btn warn" title="รัน hermes/restart-gateway.sh">↻ restart gateway</button>
</header>

<main>
  <section id="office">
    <div class="room" data-room="server"><h3>🖥 Server</h3><div class="chips"></div></div>
    <div class="room" data-room="crawl"><h3>🌐 Crawl</h3><div class="chips"></div></div>
    <div class="room" data-room="test"><h3>🧪 Test</h3><div class="chips"></div></div>
    <div class="room" data-room="break"><h3>☕ Break</h3><div class="chips"></div></div>
    <div class="room wide" data-room="build"><h3>🔨 Build</h3><div class="chips"></div></div>
    <div class="room" data-room="archive"><h3>🗄 Archive</h3><div class="chips"></div></div>
    <div class="room" data-room="lobby"><h3>🚪 Lobby <span class="manager" id="manager-led" title="Hermes gateway">🧑‍💼</span></h3><div class="chips"></div></div>
    <div class="room boss" data-room="boss"><h3>👑 Boss Office</h3><div class="chips"></div></div>
  </section>

  <aside>
    <div class="panel" id="approvals-panel">
      <h2>❗ รออนุมัติ merge</h2>
      <div id="approvals"></div>
    </div>
    <div class="panel" id="missions-panel">
      <h2>🗂 Missions</h2>
      <div id="missions"></div>
    </div>
    <div class="panel" id="log-panel">
      <h2>📜 Events</h2>
      <div id="log"></div>
    </div>
  </aside>
</main>

<footer>
  <select id="cmd-topic"></select>
  <input id="cmd-text" type="text" placeholder="สั่งงาน Hermes… เช่น ES-L: fix filter gain clamping" autocomplete="off">
  <button id="btn-send" class="btn">ส่งเข้า Hermes ▸</button>
</footer>

<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
