[package]
name = "codinal-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "codinal_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "codinal"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
base64 = "=0.23.0"
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
tauri = "=2.11.5"
tauri-plugin-deep-link = "=2.4.9"
url = "=2.5.8"
zeroize = "=1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"
