<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Codinal pixel claw GitHub avatar</title>
  <desc id="desc">A coral three-pronged pixel claw around a cream command chevron on a deep navy square.</desc>

  <!-- The stepped frame keeps the avatar legible when GitHub masks it as a circle. -->
  <path fill="#0B1020" d="M160 96H864V128H928V192H960V832H928V896H864V928H160V896H96V832H64V192H96V128H160Z"/>
  <path fill="#17243A" d="M192 144H832V176H896V240H928V784H896V848H832V880H192V848H128V784H96V240H128V176H192Z"/>
  <path fill="#223653" d="M224 192H800V224H864V288H896V736H864V800H800V832H224V800H160V736H128V288H160V224H224Z"/>

  <!-- Small ambient pixels establish the playful mascot language without adding noise. -->
  <rect x="224" y="272" width="32" height="32" fill="#FFD08A"/>
  <rect x="256" y="240" width="32" height="32" fill="#FFD08A"/>
  <rect x="736" y="272" width="32" height="32" fill="#72D7B2"/>
  <rect x="768" y="240" width="32" height="32" fill="#72D7B2"/>
  <rect x="160" y="640" width="32" height="32" fill="#2F4C70"/>
  <rect x="832" y="608" width="32" height="32" fill="#2F4C70"/>

  <!-- Shadow blocks give the claw a hand-built sprite silhouette. -->
  <path fill="#B64A59" d="M256 432H288V272H352V208H416V368H448V144H576V368H608V208H672V272H736V432H800V592H832V688H736V752H672V816H352V784H288V720H224V688H192V592H224V464H256Z"/>

  <!-- Original three-pronged claw mark. -->
  <path fill="#FF7866" d="M288 400V256H352V192H416V384H448V128H576V384H608V192H672V256H736V400H800V560H832V656H736V720H672V784H352V752H288V688H224V656H192V560H224V432H288Z"/>

  <!-- Warm highlight blocks make the upper fingers read as a single mascot form. -->
  <rect x="320" y="224" width="64" height="32" fill="#FFAE73"/>
  <rect x="480" y="160" width="64" height="32" fill="#FFAE73"/>
  <rect x="640" y="224" width="64" height="32" fill="#FFAE73"/>
  <rect x="256" y="432" width="32" height="96" fill="#FFAE73"/>
  <rect x="704" y="432" width="32" height="96" fill="#FFAE73"/>

  <!-- Dark faceplate keeps the command symbol crisp at GitHub avatar sizes. -->
  <path fill="#0B1020" d="M352 448H672V480H704V672H672V704H352V672H320V480H352Z"/>
  <rect x="352" y="480" width="32" height="32" fill="#17243A"/>
  <rect x="640" y="480" width="32" height="32" fill="#17243A"/>

  <!-- Block-built chevron: the existing Codinal command cue translated into pixels. -->
  <rect x="416" y="464" width="64" height="64" fill="#FFF0D9"/>
  <rect x="480" y="512" width="64" height="64" fill="#FFF0D9"/>
  <rect x="544" y="560" width="64" height="64" fill="#FFF0D9"/>
  <rect x="480" y="608" width="64" height="64" fill="#FFF0D9"/>
  <rect x="416" y="656" width="64" height="64" fill="#FFF0D9"/>
  <rect x="416" y="464" width="32" height="32" fill="#FFFFFF"/>
  <rect x="544" y="560" width="32" height="32" fill="#FFD08A"/>

  <!-- Grounding pixels prevent the mark from floating in the frame. -->
  <rect x="320" y="816" width="384" height="32" fill="#B64A59"/>
  <rect x="384" y="784" width="256" height="32" fill="#FF7866"/>
  <rect x="256" y="848" width="96" height="32" fill="#2F4C70"/>
  <rect x="672" y="848" width="96" height="32" fill="#2F4C70"/>
</svg>
