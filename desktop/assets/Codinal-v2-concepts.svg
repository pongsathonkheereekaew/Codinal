<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img" aria-labelledby="title desc">
  <title id="title">Codinal icon v2 concept variations</title>
  <desc id="desc">Four black and white geometric Codinal icon concepts arranged in a two by two comparison board.</desc>

  <!-- Preview board only. The light gray board is not part of any icon asset. -->
  <rect width="1800" height="1800" fill="#F1F1F1"/>

  <defs>
    <g id="frame">
      <rect x="144" y="144" width="736" height="736" rx="147" fill="#FFFFFF"/>
    </g>

    <!-- A: separated C and chevron. -->
    <g id="variant-a">
      <use href="#frame"/>
      <path d="M 692 384 C 642 344 580 324 510 324 C 367 324 274 405 274 512 C 274 619 367 700 510 700 C 580 700 642 680 692 640"
        fill="none" stroke="#111111" stroke-width="54" stroke-linecap="round"/>
      <path d="M 574 447 L 639 512 L 574 577"
        fill="none" stroke="#111111" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- B: a closed ring opened by a white negative-space chevron. -->
    <g id="variant-b">
      <use href="#frame"/>
      <circle cx="512" cy="512" r="212" fill="none" stroke="#111111" stroke-width="68"/>
      <path d="M 654 404 L 748 512 L 654 620"
        fill="none" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- C: optical interlock; the components appear nested but remain separated. -->
    <g id="variant-c">
      <use href="#frame"/>
      <path d="M 684 382 C 634 342 574 322 506 322 C 364 322 272 404 272 512 C 272 620 364 702 506 702 C 574 702 634 682 684 642"
        fill="none" stroke="#111111" stroke-width="54" stroke-linecap="round"/>
      <path d="M 590 405 L 674 512 L 590 619"
        fill="none" stroke="#111111" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- D: forward-leaning C and chevron. -->
    <g id="variant-d">
      <use href="#frame"/>
      <g transform="translate(72 0) skewX(-8)">
        <path d="M 692 384 C 642 344 580 324 510 324 C 367 324 274 405 274 512 C 274 619 367 700 510 700 C 580 700 642 680 692 640"
          fill="none" stroke="#111111" stroke-width="54" stroke-linecap="round"/>
        <path d="M 574 447 L 639 512 L 574 577"
          fill="none" stroke="#111111" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </defs>

  <g>
    <rect x="40" y="40" width="820" height="820" rx="36" fill="#FAFAFA"/>
    <svg x="140" y="70" width="620" height="620" viewBox="0 0 1024 1024" aria-label="Variation A">
      <use href="#variant-a"/>
    </svg>
    <text x="82" y="810" fill="#111111" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="28" font-weight="700" letter-spacing="2">A  SEPARATED CHEVRON</text>
  </g>

  <g>
    <rect x="940" y="40" width="820" height="820" rx="36" fill="#FAFAFA"/>
    <svg x="1040" y="70" width="620" height="620" viewBox="0 0 1024 1024" aria-label="Variation B">
      <use href="#variant-b"/>
    </svg>
    <text x="982" y="810" fill="#111111" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="28" font-weight="700" letter-spacing="2">B  NEGATIVE-SPACE CUT</text>
  </g>

  <g>
    <rect x="40" y="940" width="820" height="820" rx="36" fill="#FAFAFA"/>
    <svg x="140" y="970" width="620" height="620" viewBox="0 0 1024 1024" aria-label="Variation C">
      <use href="#variant-c"/>
    </svg>
    <text x="82" y="1710" fill="#111111" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="28" font-weight="700" letter-spacing="2">C  OPTICAL INTERLOCK</text>
  </g>

  <g>
    <rect x="940" y="940" width="820" height="820" rx="36" fill="#FAFAFA"/>
    <svg x="1040" y="970" width="620" height="620" viewBox="0 0 1024 1024" aria-label="Variation D">
      <use href="#variant-d"/>
    </svg>
    <text x="982" y="1710" fill="#111111" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="28" font-weight="700" letter-spacing="2">D  FORWARD LEAN</text>
  </g>
</svg>
