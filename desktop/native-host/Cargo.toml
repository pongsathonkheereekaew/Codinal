[package]
name = "codinal-native-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "=0.23.0"
codinal-storage = { path = "../../crates/codinal-storage" }
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
zeroize = "=1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"

[dev-dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled"] }
