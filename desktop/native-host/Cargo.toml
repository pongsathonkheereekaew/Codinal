[package]
name = "codinal-native-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "=0.23.0"
codinal-storage = { path = "../../crates/codinal-storage" }
flate2 = "=1.1.9"
getrandom = "=0.4.3"
minisign-verify = "=0.2.5"
plist = "=1.10.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
tar = "=0.4.46"
tempfile = "=3.27.0"
url = { version = "=2.5.8", features = ["serde"] }
zeroize = "=1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"
nix = { version = "=0.29.0", features = ["term", "process", "signal"] }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = ["NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSString", "NSURL"] }
rfd = "=0.17.2"
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"

[dev-dependencies]
codinal-providers = { path = "../../crates/codinal-providers" }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
