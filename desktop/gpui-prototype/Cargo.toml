[package]
name = "codinal-gpui-prototype"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
codinal-control-plane-client = { path = "../control-plane-client" }
codinal-native-host = { path = "../native-host" }
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "ae394f3d474f4996d2cdef6ee97551fdb6748acd" }
serde_json = "=1.0.149"
vt100 = "=0.16.2"
zeroize = "=1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "ae394f3d474f4996d2cdef6ee97551fdb6748acd", features = ["font-kit"] }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSSecureTextField", "NSTextField", "NSView"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "ae394f3d474f4996d2cdef6ee97551fdb6748acd", features = ["wayland", "x11"] }
