name: live-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  provider:
    runs-on: macos-14
    if: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pongsathonkheeereekaew/CEDIA-IDE
          ref: codex/agent-ide
          path: cedia-ide
      - uses: actions/checkout@v4
        with:
          path: cedia
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Install extension
        run: |
          cd cedia-ide/extensions/cedia-agent
          npm install
          npm run compile
      - name: Live provider smoke
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ln -s "$PWD/cedia-ide" "$HOME/cedia-ide"
          bash cedia/scripts/live-provider-smoke.sh
