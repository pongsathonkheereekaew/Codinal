name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verify dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Codinal product verification
        run: bash verify.sh

  desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/gpui/Cargo.toml -- --check
      - name: Lint desktop shell
        run: cargo clippy --manifest-path desktop/gpui/Cargo.toml --all-targets -- -D warnings
      - name: Test desktop shell
        run: cargo test --manifest-path desktop/gpui/Cargo.toml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell lint scripts
        run: |
          set -e
          for f in install.sh backup.sh verify.sh bootstrap.sh scripts/*.sh harness/scripts/adapters/*verify.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done
      - name: Markdown lint (when available)
        run: |
          if command -v npx >/dev/null 2>&1; then
            npx --yes markdownlint-cli2 "docs/**/*.md" "harness/**/*.md" || true
          fi
