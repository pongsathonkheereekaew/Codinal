plugins:
  - id: cedia-agent
    version: 0.1.0
    entry: extensions/cedia-agent
    skills: [core]
    permissions: [read, edit, bash, webfetch, websearch, external_directory]
    mcp: [cedia-filesystem, cedia-browser]

mcp:
  - id: cedia-filesystem
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem"]
    enabled: false
  - id: cedia-browser
    transport: http
    url: http://127.0.0.1:9010/mcp
    enabled: false
  - id: cedia-browser-playwright
    transport: stdio
    command: npx
    args: ["-y", "@playwright/mcp@latest", "--headless"]
    enabled: false
  - id: cedia-context
    transport: http
    url: http://127.0.0.1:41783/mcp
    enabled: false
