# Minimal agent configuration for the CEDIA IDE harness.
#
# Switch models across all supported providers by changing ONE field:
#   active_model: <model profile id>
# The IDE extension and CLI read this file through harness_agent.py, so no
# other code needs to know the provider-specific model name or base URL.

schema_version: 1

active_model: deepseek/deepseek-chat

models:
  - id: deepseek/deepseek-chat
    provider: deepseek
    kind: openai-compatible
    model: deepseek-chat
    api_base: https://api.deepseek.com/v1
    context_window: 64000
    capabilities: [streaming, tools, reasoning]
  - id: openai/gpt-5.1
    provider: openai
    kind: openai-compatible
    model: gpt-5.1
    api_base: https://api.openai.com/v1
    context_window: 400000
    capabilities: [streaming, tools, vision]
  - id: anthropic/claude-sonnet-4-6
    provider: anthropic
    kind: anthropic
    model: claude-sonnet-4-6
    context_window: 200000
    capabilities: [streaming, tools]
  - id: gemini/gemini-2.5-flash
    provider: google
    kind: gemini
    model: gemini-2.5-flash
    context_window: 1000000
    capabilities: [streaming, tools, vision]
  - id: ollama/qwen2.5-coder
    provider: ollama
    kind: openai-compatible
    model: qwen2.5-coder:7b
    api_base: http://127.0.0.1:11434/v1
    context_window: 32000
    capabilities: [streaming, tools]

plugins:
  - id: cedia-agent
    version: 0.1.0
    entry: extensions/cedia-agent
    skills: [core]
    permissions: [read, edit, bash, webfetch, websearch, external_directory]
    mcp: [cedia-filesystem, cedia-browser]

mcp:
  - id: cedia-filesystem
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem"]
    enabled: false
  - id: cedia-browser
    transport: stdio
    command: npx
    args: ["-y", "@playwright/mcp@latest"]
    enabled: false
  - id: cedia-context
    transport: http
    url: http://127.0.0.1:41783/mcp
    enabled: false
