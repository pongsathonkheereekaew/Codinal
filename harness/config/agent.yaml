# Minimal agent configuration for the CEDIA IDE harness.
#
# Switch models across all supported providers by changing ONE field:
#   active_model: <model profile id>
# The IDE extension and CLI read this file through harness_agent.py, so no
# other code needs to know the provider-specific model name or base URL.

schema_version: 1

active_model: opencode-go/deepseek-v4-flash

models:
  - id: opencode-go/grok-4.5
    provider: opencode-go
    kind: openai-compatible
    model: opencode-go-grok-4-5
    api_base: http://127.0.0.1:4120/v1
    context_window: 500000
    capabilities: [streaming, tools, reasoning]
    effort: high
    efforts: [low, medium, high]
